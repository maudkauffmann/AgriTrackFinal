security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: telUtilisateur

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api_cors:
            pattern: ^/api
            methods: [ OPTIONS ]
            security: false

        login:
            pattern: ^/api/login$
            stateless: true
            json_login:
                check_path: /api/login
                username_path: telUtilisateur
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # firewall dédié à React (API)
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        # firewall pour EasyAdmin
        main:
            lazy: true
            provider: app_user_provider
            entry_point: form_login
            form_login:
                login_path: app_login    # Route de la page de login HTML
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
            custom_authenticator: App\Security\AppAuthenticator

    access_control:
        # CRITICAL 1 : Autoriser TOUTES les requêtes CORS OPTIONS sur /api avant les restrictions de jeton
        - { path: ^/api, methods: [ OPTIONS ], roles: PUBLIC_ACCESS }

        # 2. Permettre l'accès public au login de l'API
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/login,     roles: PUBLIC_ACCESS }

        # 3. Restreindre et sécuriser le reste de l'API (Demande un Token JWT valide)
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }

        # 4. Interface d'administration
        - { path: ^/admin,     roles: ROLE_ADMIN }

    role_hierarchy:
        ROLE_SUPERVISEUR: ROLE_USER
        ROLE_ADMIN: ROLE_SUPERVISEUR
